[project]
name = "stgnn-conflict"
version = "0.1.0"
description = "ST-GNN guided, deterministic-certification accelerated conflict detection for high-density UAV trajectories"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "pandas>=2.2",
]

[project.optional-dependencies]
# ST-GNN 推理需要 PyTorch；不启用 GNN 引导时无需安装
torch = ["torch>=2.4"]
# 结果出图（论文用 PNG）；不安装时表格产物不受影响
plots = ["matplotlib>=3.8"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
stgnn-run = "stgnn_conflict.experiments.runner:main"
stgnn-dataset = "stgnn_conflict.dataset.cli:main"
stgnn-train = "stgnn_conflict.training.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stgnn_conflict"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
